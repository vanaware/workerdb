name: Publish to JSR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for JSR OIDC authentication

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Sanitize Version
        run: |
          chmod +x ./sanitize-version.sh
          ./sanitize-version.sh ./packages/worker-db/deno.jsonc

      - name: Publish to JSR
        run: deno publish --allow-slow-types packages/worker-db
